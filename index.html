<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="化学グランプリ・IChOを目指すためのオフライン学習アプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Chemistry Trainer</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1724;--panel:#12263a;--panel2:#18334c;--line:#29465f;--text:#edf5fb;--muted:#a9bdcc;--accent:#65c7bd;--accent2:#f4c66a;--bad:#ff8b8b;--good:#8be0ad}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#102a43 0%,var(--bg) 42%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}
    header{padding:22px 18px 16px;max-width:850px;margin:auto}h1{font-size:25px;margin:0 0 5px;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px}.wrap{max-width:850px;margin:auto;padding:0 14px 40px}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:11px;border:1px solid var(--line);padding:5px 9px;border-radius:30px;color:var(--accent)}
    nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 16px}.navbtn,button,select{font:inherit}.navbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:11px 5px;border-radius:12px;font-size:13px}.navbtn.active{background:var(--panel2);border-color:var(--accent);color:var(--text)}
    .card{background:rgba(18,38,58,.94);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 8px 28px #0002}.hero{background:linear-gradient(135deg,#183b53,#142b40)}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:18px 0 8px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#0d2031;border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.primary,.secondary,.ghost{border:0;border-radius:11px;padding:12px 15px;font-weight:650;cursor:pointer}.primary{background:var(--accent);color:#09212a}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}button:disabled{opacity:.45;cursor:not-allowed}
    .topics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.topic{padding:13px;border-radius:12px;background:#0e2234;border:1px solid var(--line)}.topic b{display:block;font-size:14px}.topic span{font-size:11px;color:var(--muted)}
    .question{font-size:16px;line-height:1.8;white-space:pre-wrap}.qmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:11px;color:var(--accent);border:1px solid #376b72;border-radius:20px;padding:4px 8px}
    .choice{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;background:#0d2031;color:var(--text);border:1px solid var(--line);border-radius:11px}.choice.selected{border-color:var(--accent);background:#17374a}.choice.correct{border-color:var(--good)}.choice.wrong{border-color:var(--bad)}
    textarea,input,select{width:100%;background:#0b1d2c;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px}textarea{min-height:105px;resize:vertical}.feedback{padding:13px;border-radius:12px;background:#0c2030;border:1px solid var(--line);line-height:1.75;margin-top:12px}.hidden{display:none!important}.progress{height:9px;background:#0b1d2c;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.divider{height:1px;background:var(--line);margin:15px 0}footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
    @media(min-width:650px){.topics{grid-template-columns:repeat(3,1fr)}nav{max-width:600px}.question{font-size:17px}}
  </style>
</head>
<body>
<header><div class="topline"><div><h1>⚗ Chemistry Trainer</h1><div class="sub">化学グランプリから IChO へ</div></div><span class="pill" id="offlineBadge">オフライン対応</span></div></header>
<div class="wrap">
<nav aria-label="メインメニュー">
 <button class="navbtn active" data-page="home">ホーム</button><button class="navbtn" data-page="practice">演習</button><button class="navbtn" data-page="review">苦手復習</button><button class="navbtn" data-page="progress">学習記録</button>
</nav>
<main id="app"></main>
<footer>学習データはこの端末内に保存されます。外部サーバーへの送信はありません。</footer>
</div>
<script src="app.js"></script>
</body></html>
